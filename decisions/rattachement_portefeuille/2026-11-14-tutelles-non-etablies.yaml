# Issue #80 : portefeuilles de ministres délégués, secrétaires d'État et hauts-commissaires dont
# R-COMPOSITION ne lit pas la tutelle dans le libellé de l'Assemblée (gouvernements publiés,
# d'Ayrault II à Lecornu II ; génération g13 et archive AMO30 du 14/11/2026).
#
# objet    : l'organe ministère du portefeuille (PO…).
# decision : « rattache_a » suivi du ou des ministères de tutelle (PO…), dans l'ordre où la
#            source les nomme. Plusieurs organes = co-tutelle, toutes servies (décision de la
#            propriétaire du 14/11/2026 : « Tous les ministres »).
# source   : le texte qui établit la tutelle (décret au Journal officiel, sinon le libellé publié
#            par l'Assemblée).
# Les champs `personne` et `portefeuille` ne servent qu'à la relecture.
