# Liste des candidats à l'élection présidentielle de 2027, d'après franceinfo.
#
# Décision du 13/11/2026 (« la liste de candidats doit se baser sur celle de franceinfo »,
# puis option « A ») : franceinfo réserve la fouille de textes et de données et interdit son
# site aux robots d'IA ; la page n'est donc pas collectée. La liste est recopiée ici à la main
# (faits seulement : nom, statut, parti tels que la page les affiche), puis validée par la
# propriétaire en fusionnant la pull request.
#
# Identité, jamais par le nom seul : `wikidata` est l'élément relié à l'article Wikipédia que la
# liste de Wikipédia citait (lien déclaré) ; quand l'article a été trouvé par le nom
# (`rattachement_par_nom: true`), le rattachement est validé par la propriétaire. `article_frwiki`
# et `nom_wikipedia` gardent les clés sous lesquelles le registre des identités connaît déjà la
# personne : sans elles, elle recevrait un nouveau numéro.
#
# Statuts : `declaree`, `retiree` (affichée comme retirée par la page), `non_listee` (absente
# de la page, données gardées). Une nouvelle lecture de la page est un nouveau fichier : la
# liste en vigueur est celle du fichier le plus récent (champ `date`).
