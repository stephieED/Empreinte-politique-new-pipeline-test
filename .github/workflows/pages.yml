# Pages du dépôt d'essai (décision de la propriétaire du 13/11/2026 : « Doc + page minimale ») :
# la documentation du code (pdoc), la description du traitement tirée du code (`traitement/`,
# issue #95), les documents de conception de `livrables/` convertis en HTML (`livrables/`, s'ils
# sont dans le dépôt ; décision du 13/11/2026) et la page minimale de contrôle avec les fichiers
# servis de la dernière publication (release `publication`). Ce n'est pas le site : l'interface reste hors
# périmètre. Une seule tâche déploie, avec les seuls droits de Pages ; rien n'écrit dans le code,
# l'entrepôt ni les releases.
#
# Quand : après chaque mise à jour sur `main` (une nuit publiée apporte une nouvelle archive), après
# un envoi sur `main` qui change le code (la documentation), et à la main.
name: Pages
on:
  workflow_run:
    workflows: ["Mise à jour"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ["empreinte_src/**", "pyproject.toml", "pages/**", "config/points_acces.yaml",
            "livrables/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  construire:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -e ".[doc]"
      - name: Documentation du code (pdoc)
        run: pdoc ./empreinte_src --docformat markdown -o sortie-pages/doc
      - name: Description du traitement, tirée du code (issue 95)
        run: >-
          python -m empreinte_src.methodologie sortie-pages/traitement
          --commit "$GITHUB_SHA" --depot "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      - name: Documents de conception (livrables/ en HTML ; rien s'il n'y en a pas)
        run: python -m empreinte_src.pages_livrables livrables sortie-pages/livrables
      - name: Page minimale et fichiers servis de la dernière publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp pages/index.html sortie-pages/index.html
          # Les archives s'appellent site-gNNNNNN.tar.gz : la plus grande génération est la dernière.
          NOM=$(gh release view publication -R "$GITHUB_REPOSITORY" --json assets \
                  -q '[.assets[].name | select(startswith("site-g"))] | sort | last // ""' || true)
          if [ -z "$NOM" ]; then
            echo "Aucune publication : la page minimale n'est pas déployée."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/site"
          gh release download publication -R "$GITHUB_REPOSITORY" -p "$NOM" -D "$RUNNER_TEMP/site"
          tar xzf "$RUNNER_TEMP/site/$NOM" -C "$RUNNER_TEMP/site"
          mv "$RUNNER_TEMP/site/${NOM%.tar.gz}" sortie-pages/site
          echo "${NOM%.tar.gz}" > sortie-pages/site/archive.txt
      - name: Ce qui est déployé (commande, section 5)
        run: |
          set -euo pipefail
          {
            echo "## Pages : ce qui est déployé"
            echo ""
            echo "| Partie | Fichiers | Octets |"
            echo "| --- | ---: | ---: |"
            for p in doc traitement livrables site; do
              if [ -d "sortie-pages/$p" ]; then
                echo "| $p | $(find "sortie-pages/$p" -type f | wc -l) | $(du -sb "sortie-pages/$p" | cut -f1) |"
              fi
            done
            echo "| total | $(find sortie-pages -type f | wc -l) | $(du -sb sortie-pages | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sortie-pages

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
