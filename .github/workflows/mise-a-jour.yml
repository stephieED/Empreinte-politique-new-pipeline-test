# Mise à jour nocturne (doc. 2 ; droits : doc. 2, 2.15, correction P3).
# Seule la tâche `ecrire` peut écrire dans le dépôt ; seule `alerter` peut écrire des issues.
# `preparer` et `collecter` lisent les artefacts des exécutions passées (rattrapage d'une
# nuit non écrite) : droit `actions: read`.
name: Mise à jour

on:
  schedule:
    - cron: "30 20 * * *"     # chaque soir, 21 h 30 ou 22 h 30 à Paris
    - cron: "30 23 * * *"     # second déclenchement : GitHub retarde ou abandonne parfois une tâche planifiée
  workflow_dispatch:
    inputs:
      mode:
        description: "quotidien, complet (relire toutes les sources sans requête conditionnelle) ou essai (aucune écriture)"
        type: choice
        options: [quotidien, complet, essai]
        default: quotidien
      points:
        description: "Points d'accès à relever, séparés par des espaces (vide = tous)"
        type: string
        default: ""

permissions:
  contents: read

# Une file pour la nuit et les mises à jour qui écrivent (`quotidien`, `complet`) ; chaque essai a
# la sienne et part tout de suite (13/11/2026) : il n'écrit rien, et six essais s'attendaient les
# uns les autres. Un essai ne doit pas déborder sur la nuit (20 h 30 UTC) : il lirait l'entrepôt
# pendant qu'elle l'écrit (faux échec possible, jamais de publication abîmée).
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'essai' && format('essai-{0}', github.run_id) || 'mise-a-jour' }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  preparer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      faire: ${{ steps.plan.outputs.faire }}
      mode: ${{ steps.plan.outputs.mode }}
      points: ${{ steps.plan.outputs.points }}
      rattrapage_run: ${{ steps.plan.outputs.rattrapage_run }}
      rattrapage_nom: ${{ steps.plan.outputs.rattrapage_nom }}
      rattrapage_erreur: ${{ steps.plan.outputs.rattrapage_erreur }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -e .
      - id: plan
        name: Plan de la nuit
        run: |
          MODE="${{ inputs.mode || 'quotidien' }}"
          POINTS="${{ inputs.points }}"
          empreinte preparer --mode "$MODE" ${POINTS:+--points $POINTS}
          FAIRE=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Le second déclenchement s'arrête si une génération a déjà été écrite depuis 20 h.
            # Une erreur de la planification ne supprime pas la nuit (#41) : elle se fait.
            FAIRE=$(python -m empreinte_src.planification --depot "$GITHUB_REPOSITORY" || echo true)
          fi
          # La nuit est décidée avant le rattrapage : une étape accessoire ne doit pas l'empêcher (#41).
          { echo "faire=$FAIRE"; echo "mode=$MODE"; echo "points=$POINTS"; } >> "$GITHUB_OUTPUT"
          # Une erreur de l'API rend {"erreur": …} : la nuit continue sans rattrapage, l'erreur va au rapport.
          R=$(python -m empreinte_src.rattrapage --depot "$GITHUB_REPOSITORY" --run-actuel "$GITHUB_RUN_ID" || echo '{"erreur": "rattrapage : sortie en erreur"}')
          echo "Rattrapage : ${R}"
          {
            echo "rattrapage_run=$(echo "$R" | python -c 'import json,sys; print(json.load(sys.stdin).get("run",""))')"
            echo "rattrapage_nom=$(echo "$R" | python -c 'import json,sys; print(json.load(sys.stdin).get("nom",""))')"
            echo "rattrapage_erreur=$(echo "$R" | python -c 'import json,sys; print(json.load(sys.stdin).get("erreur","").replace(chr(10)," "))')"
          } >> "$GITHUB_OUTPUT"

  collecter:
    needs: preparer
    if: needs.preparer.outputs.faire == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
      actions: read
    outputs:
      generation: ${{ steps.collecte.outputs.generation }}
      acquis: ${{ steps.collecte.outputs.acquis }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -e .
      - name: Copie de travail (cache, accélérateur seulement)
        uses: actions/cache/restore@v4
        with:
          path: |
            entrepot/manifeste.json
            entrepot/index.parquet
            entrepot/releves.parquet
            entrepot/generations.parquet
            entrepot/registres/
          key: entrepot-${{ github.run_id }}
          restore-keys: entrepot-
      - name: Restaurer la génération courante (sans les octets)
        run: empreinte restaurer --entrepot entrepot
      - name: Récupérer l'acquis d'une nuit non écrite
        if: needs.preparer.outputs.rattrapage_run != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.preparer.outputs.rattrapage_nom }}
          run-id: ${{ needs.preparer.outputs.rattrapage_run }}
          github-token: ${{ github.token }}
          path: rattrapage
      - name: Superposer la nuit rattrapée
        if: needs.preparer.outputs.rattrapage_run != ''
        run: empreinte superposer --entrepot entrepot --depuis rattrapage/entrepot
      - name: Octets gardés des gros fichiers coupés (cache, #32)
        uses: actions/cache/restore@v4
        with:
          path: partiels
          key: partiels-${{ github.run_id }}
          restore-keys: partiels-
      - id: collecte
        name: Relever, dépaqueter, versionner (E1, E2)
        env:
          # Par l'environnement, jamais recopié dans le script : le message peut contenir des guillemets.
          RATTRAPAGE_ERREUR: ${{ needs.preparer.outputs.rattrapage_erreur }}
        run: |
          POINTS="${{ needs.preparer.outputs.points }}"
          mkdir -p sortie
          /usr/bin/time -v -o sortie/time-collecter.txt \
            empreinte collecter --entrepot entrepot --mode "${{ needs.preparer.outputs.mode }}" \
              --rapport sortie/rapport.json --tmp "$RUNNER_TEMP" ${POINTS:+--points $POINTS} \
              --partiels partiels ${RATTRAPAGE_ERREUR:+--rattrapage-erreur "$RATTRAPAGE_ERREUR"}
          # Durée seulement : le pic de `time -v` ne vaut que pour la dernière étape (le traitement
          # remet le pic à zéro à chaque étape) ; le vrai pic est imprimé par la commande.
          grep -E "Elapsed" sortie/time-collecter.txt || true
          G=$(python -c 'import json; print("%06d" % json.load(open("entrepot/manifeste.json"))["generation"])')
          echo "generation=$G" >> "$GITHUB_OUTPUT"
          # Un essai n'écrit rien : son acquis porte un autre nom, que le rattrapage ne reprend jamais.
          if [ "${{ needs.preparer.outputs.mode }}" = "essai" ]; then echo "acquis=essai-g$G"; else echo "acquis=acquis-g$G"; fi >> "$GITHUB_OUTPUT"
      - name: Garder les octets des gros fichiers coupés (#32)
        # Même après une collecte en échec : c'est précisément ce qu'on veut garder.
        if: always() && hashFiles('partiels/*.part') != ''
        uses: actions/cache/save@v4
        with:
          path: partiels
          key: partiels-${{ github.run_id }}
      - name: Remettre l'acquis à la tâche d'écriture
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collecte.outputs.acquis }}
          path: |
            entrepot/
            sortie/
          retention-days: 14
          if-no-files-found: error
      - name: Garder la copie de travail (sans les octets)
        uses: actions/cache/save@v4
        with:
          path: |
            entrepot/manifeste.json
            entrepot/index.parquet
            entrepot/releves.parquet
            entrepot/generations.parquet
            entrepot/registres/
          key: entrepot-${{ github.run_id }}

  calculer:
    needs: [preparer, collecter]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -e .
      - name: Octets des générations écrites
        run: empreinte restaurer --entrepot entrepot --avec-blobs
      - name: Acquis de la nuit
        uses: actions/download-artifact@v4
        with: { name: "${{ needs.collecter.outputs.acquis }}", path: . }
      - name: Faits déjà lus (cache, accélérateur seulement)
        uses: actions/cache/restore@v4
        with:
          path: z2
          key: z2-${{ github.run_id }}
          restore-keys: z2-
      - name: Faits de la dernière publication (pour les contrôles des pertes, C1 et C6)
        run: |
          # La dernière publication réussie, pas la nuit précédente : une nuit refusée ne publie
          # pas ses faits, et la comparer désactivait C1 et C6 la nuit suivante (09 et 11/11/2026).
          mkdir -p precedent
          # Une erreur de l'API n'est pas « aucune publication » : le calcul s'arrête (issue #40).
          NOM=$(python -m empreinte_src.distant derniere-publication --depot "$GITHUB_REPOSITORY") || {
            echo "::error::Dernière publication illisible : C1 et C6 ne peuvent pas être appliqués"; exit 1; }
          if [ -n "$NOM" ]; then
            gh release download export -R "$GITHUB_REPOSITORY" -p "$NOM" -D precedent
          else
            echo "Aucune publication précédente : premier calcul, rien à comparer."
          fi
      - name: Lire, relier, composer, contrôler, exporter (E3 à E6)
        env:
          EMPREINTE_DUCKDB_MEMOIRE: 4GB      # machine de GitHub : 16 Go (la valeur par défaut, 1 Go, vise la machine de développement)
          EMPREINTE_DUCKDB_FILS: "4"
        run: |
          /usr/bin/time -v -o sortie/time-calculer.txt \
            empreinte calculer --entrepot entrepot --z2 z2 --z3 z3 --decisions decisions \
              --sortie sortie --rapport sortie/rapport.json \
              --faits-precedents "$(find precedent -maxdepth 1 -name 'faits-publies-g*.parquet' 2>/dev/null | head -1)"
          # Durée seulement : le pic de `time -v` ne vaut que pour la dernière étape (le traitement
          # remet le pic à zéro à chaque étape) ; le vrai pic est imprimé par la commande.
          grep -E "Elapsed" sortie/time-calculer.txt || true
      - name: Garder les faits lus
        # Pas pour un essai : ses faits sont lus avec le code de sa branche, et la nuit reprend le
        # cache le plus récent (issue #44, seconde moitié).
        if: needs.preparer.outputs.mode != 'essai'
        uses: actions/cache/save@v4
        with:
          path: z2
          key: z2-${{ github.run_id }}
      - name: Remettre la candidate à la tâche d'écriture
        uses: actions/upload-artifact@v4
        with:
          name: candidate-g${{ needs.collecter.outputs.generation }}
          path: sortie/
          retention-days: 14

  ecrire:
    # Seule tâche qui écrit (P3). Elle écrit l'acquis même si le calcul a échoué.
    needs: [preparer, collecter, calculer]
    if: always() && needs.collecter.result == 'success' && needs.preparer.outputs.mode != 'essai'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -e .
      - uses: actions/download-artifact@v4
        with: { name: "${{ needs.collecter.outputs.acquis }}", path: . }
      - name: Candidate (si le calcul a réussi)
        if: needs.calculer.result == 'success'
        uses: actions/download-artifact@v4
        with: { name: "candidate-g${{ needs.collecter.outputs.generation }}", path: sortie }
      - name: Écrire la génération dans l'entrepôt, et l'export
        run: empreinte ecrire --entrepot entrepot --rapport sortie/rapport.json
      - name: Rapport de la nuit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport
          path: |
            sortie/rapport.json
            sortie/time-*.txt
          retention-days: 90

  alerter:
    needs: [preparer, collecter, calculer, ecrire]
    if: always() && needs.preparer.outputs.faire == 'true' && needs.preparer.outputs.mode != 'essai'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -e .
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: rapport, path: sortie }
      - name: Une issue par sujet
        env:
          URL_EXECUTION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: empreinte alerter --rapport sortie/rapport.json
