# Tests sans réseau, sur des extraits réels des sources (cahier 6.3).
name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # L'extra `doc` aussi : la conversion des livrables pour Pages (markdown2) est testée.
      - run: pip install -q -e ".[test,doc]"
      - run: python -m pytest -q

  workflows:
    # Le shell écrit dans les workflows est vérifié (issue #47) : actionlint lit les workflows et
    # passe chaque bloc `run:` à shellcheck (installé sur ubuntu-latest). Une continuation `\`
    # suivie d'une espace ou d'un commentaire, une variable non citée, une expression `${{ }}`
    # recopiée dans un script : la commande serait coupée ou détournée sans que rien ne le dise.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: actionlint et shellcheck
        env:
          V: "1.7.7"      # version épinglée (19/01/2025) ; archive vérifiée par les empreintes publiées avec elle
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${V}"
          curl -fsSLO "$base/actionlint_${V}_linux_amd64.tar.gz"
          curl -fsSLO "$base/actionlint_${V}_checksums.txt"
          grep " actionlint_${V}_linux_amd64.tar.gz\$" "actionlint_${V}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${V}_linux_amd64.tar.gz" actionlint
          shellcheck --version | head -2
          ./actionlint -color

  documentation:
    # Documentation du code, tirée des docstrings par pdoc ; déposée comme artefact, sur chaque
    # branche. Celle de `main` est aussi servie par Pages (workflow `pages.yml`).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -e ".[doc]"
      - run: pdoc ./empreinte_src --docformat markdown -o documentation-code
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-code
          path: documentation-code/
          retention-days: 30
