# Q47 (doc. 5) : lois publiées au Journal officiel, absentes des actes de promulgation de
# l'Assemblée, que R-LOI-DOSSIER ne relie à aucun dossier (alerte #146). Décision de la
# propriétaire du 23/11/2026 : « Une décision par loi ». Chaque entrée est un écart de la source,
# vérifié une fois : A3 la compte sans la nommer ; une entrée qui ne s'applique plus (la loi
# apparaît à l'Assemblée, R-LOI-DOSSIER la relie, ou le JO ne la publie plus) est nommée par A7.
#
# Relevé le 23/11/2026 sur la g20 (lecteur `jo_actes` version 3, R-LOI-DOSSIER version 2) et sur
# les archives brutes de l'Assemblée (XIVe : un fichier arrêté au 09/03/2018 ; XVe à XVIIe).
# Toutes ces lois viennent d'un texte engagé avant la législature de leur promulgation.
#
# numero_loi          : numéro de la loi au JO.
# legislature         : législature de la promulgation.
# dossier             : le dossier de l'Assemblée qui porte le texte, retrouvé par son adresse au
#                       Sénat (`senatChemin`), sinon `aucun`. Pour mémoire : il ne relie pas la loi.
# cause               : absente_des_archives_de_l_assemblee (les documents de l'Assemblée que le JO
#                       cite ne sont dans aucune archive de l'Assemblée, du type et de la
#                       législature voulus) ; nature_fausse_au_jo (le JO nomme mal le document).
# documents_cherches  : les documents de l'Assemblée cités par le JO, cherchés dans
#                       `legislatures_cherchees` (celle de la promulgation et la précédente, ou
#                       celle que le JO nomme).
