  # --- Wikidata : identifiants Assemblée (P4123), Sénat (P1808), Sycomore (P1045), naissance,
  # et titre de l'article Wikipédia, pour toutes les personnes qui ont un identifiant
  # parlementaire. Sert à rattacher un candidat (lien de l'article dans Wikipédia) à son
  # identifiant à l'Assemblée sans passer par le nom (décision du 06/11/2026). Résultats triés :
  # sans tri, l'ordre change d'une nuit à l'autre et chaque nuit ferait une version nouvelle.
  - id: wd-identifiants-parlementaires
    source: wikidata
    type: identifiants_wikidata
    url: "https://query.wikidata.org/sparql?format=json&query=SELECT%20%3Fitem%20%3Fan%20%3Fsenat%20%3Fsycomore%20%3Fnaissance%20%3Farticle%20WHERE%20%7B%0A%20%20%7B%20%3Fitem%20wdt%3AP4123%20%3Fan%20.%20%7D%20UNION%20%7B%20%3Fitem%20wdt%3AP1808%20%3Fsenat%20.%20%7D%0A%20%20OPTIONAL%20%7B%20%3Fitem%20wdt%3AP1808%20%3Fsenat%20.%20%7D%0A%20%20OPTIONAL%20%7B%20%3Fitem%20wdt%3AP4123%20%3Fan%20.%20%7D%0A%20%20OPTIONAL%20%7B%20%3Fitem%20wdt%3AP1045%20%3Fsycomore%20.%20%7D%0A%20%20OPTIONAL%20%7B%20%3Fitem%20wdt%3AP569%20%3Fnaissance%20.%20%7D%0A%20%20OPTIONAL%20%7B%20%3Farticle%20schema%3Aabout%20%3Fitem%20%3B%20schema%3AisPartOf%20%3Chttps%3A//fr.wikipedia.org/%3E%20.%20%7D%0A%7D%20ORDER%20BY%20%3Fitem%20%3Fan%20%3Fsenat%20%3Fsycomore%20%3Fnaissance%20%3Farticle"
    format: api_json
    uid: identifiants-parlementaires
    licence: cc0-1.0

  # --- Parlement européen : les candidats anciens ou actuels députés européens (décision Q3 du
  # 13/11/2026 ; portail du PE pour les mandats). Identifiant européen déclaré par Wikidata (P1186)
  # pour les éléments de la liste des candidats (decisions/candidature), puis la fiche de chaque
  # député européen et le nom de ses groupes. Plusieurs requêtes, une toutes les 2,1 s : voir
  # empreinte_src/collecte_pe.py. Pas d'ETag : relu chaque nuit, versionné si les octets changent.
  - id: pe-eurodeputes
    source: europarl
    type: eurodeputes_pe
    url: https://data.europarl.europa.eu/api/v2/
    format: pe_eurodeputes
    decisions: decisions
    licence: cc-by-4.0

  # --- Parlement européen : décisions de chaque séance plénière depuis la législature ouverte le
  # 02/07/2019 (votes nominatifs, député européen par député européen ; décision Q3 du 13/11/2026 ;
  # avant : Parltrack). Une requête toutes les 2,1 s ; une séance déjà rangée n'est relue que si
  # elle a moins de 60 jours ; premier remplissage ≈ 380 séances. Voir empreinte_src/collecte_pe.py.
  - id: pe-votes
    source: europarl
    type: votes_pe
    url: https://data.europarl.europa.eu/api/v2/meetings
    format: pe_votes
    depuis: "2019-07-02"
    fenetre_jours: 60
    budget_s: 2400
    licence: cc-by-4.0
