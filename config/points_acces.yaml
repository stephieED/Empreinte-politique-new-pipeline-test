  # --- Sénat : export complet (un dump SQL), régénéré chaque nuit
  - id: senat-export
    source: senat
    type: export_sens
    url: https://data.senat.fr/data/senateurs/export_sens.zip
    format: zip
    taille_min: 1000000            # l'export a déjà été servi vide (444 octets, HTTP 200)
    licence: etalab-2.0

  # --- Journal officiel : livraisons de la DILA, relevées depuis la dernière traitée
  - id: jo-livraisons
    source: dila
    type: jorf
    url: https://echanges.dila.gouv.fr/OPENDATA/JORF/
    format: liste_tar
    motif: '^JORF_\d{8}-\d{6}\.tar\.gz$'
    # Un même texte figure deux fois par livraison (texte/version et texte/struct) : l'uid est
    # qualifié par ce dossier, lu sans l'horodatage de la livraison.
    qualifier_uid: '^\d{8}-\d{6}/jorf/global/(?P<q>.+?)/JORF/'
    premiere_livraison: "JORF_20261006"   # premier remplissage de cette tranche : 30 jours ; avant : l'archive globale (jo-global)
    licence: etalab-2.0

  # --- Journal officiel : archive globale de la DILA (depuis 1861, 1,75 Go, 7,2 millions de
  # fichiers ; celle du 08/11/2026 remplace les livraisons quotidiennes plus anciennes, retirées).
  # Relevée une fois. Décision du 13/11/2026 : l'archive reçue est gardée à l'octet (release
  # `archives-brutes`) ; l'entrepôt ne découpe que les actes et sommaires publiés depuis la XIVe.
  - id: jo-global
    source: dila
    type: jorf
    url: https://echanges.dila.gouv.fr/OPENDATA/JORF/
    format: archive_globale
    motif: '^Freemium_jorf_global_\d{8}-\d{6}\.tar\.gz$'
    qualifier_uid: '^\d{8}-\d{6}/jorf/global/(?P<q>.+?)/JORF/'
    depuis: "2012-06-20"
    licence: etalab-2.0

