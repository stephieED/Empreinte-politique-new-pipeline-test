# Points d'accès relevés par le traitement (étape 2, périmètre validé le 06/11/2026).
# Chaque point d'accès : une source, une adresse, un format d'archive, une cadence.
# Les adresses de l'Assemblée sont celles des pages de jeux du portail, vérifiées le
# 06/11/2026 ; elles ne sont jamais déduites d'une législature à l'autre.

parametres:
  user_agent: "empreinte-pipeline-essai/0.1 (+https://github.com/stephieED/Empreinte-politique-new-pipeline-test)"
  fenetre_interdite: false        # 9 h–19 h lun.–ven. hors fériés : désactivée sur le dépôt d'essai
  baisse_suspecte: 0.05           # Q12 : un relevé dont le nombre de membres baisse de plus de 5 % est suspect
  segment_max_octets: 94371840    # Q25 : 90 Mo
  morceau_blob_octets: 67108864   # un fichier membre plus gros est rangé en morceaux de 64 Mo
  budget_telechargement_s: 1800   # 30 min par fichier, reprises comprises ; au-delà, nouvel essai la nuit suivante
  verification_croisee: 20        # Q14 : scrutins relus sur les pages publiques (2 faits chacun, A2) ; 0 pour ne pas relire

